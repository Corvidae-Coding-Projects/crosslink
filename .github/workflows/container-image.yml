name: Container Image


















on:
  push:
    branches: [develop]
    tags: ['v*']
  pull_request:
    paths:
      - 'crosslink/resources/container/**'
      - '.github/workflows/container-image.yml'
      - 'crosslink/Cargo.toml'
      - 'crosslink/Cargo.lock'



  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io


  IMAGE_NAME: crosslink-agent

jobs:



  build-binary:
    name: Build binary (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:


          - arch: amd64
            target: x86_64-unknown-linux-musl
            use_cross: false








          - arch: arm64
            target: aarch64-unknown-linux-musl
            use_cross: true
    defaults:
      run:
        working-directory: crosslink
    steps:
      - uses: actions/checkout@v4

      - name: Install musl-tools (amd64 native build)
        if: matrix.use_cross == false
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (arm64 only)
        if: matrix.use_cross == true
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            crosslink/target/
          key: ${{ runner.os }}-cargo-container-${{ matrix.target }}-${{ hashFiles('crosslink/Cargo.lock') }}

      - name: Pin the default agent image tag (release tags only)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: echo "CROSSLINK_AGENT_IMAGE_TAG=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build release binary (native)
        if: matrix.use_cross == false
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Build release binary (cross)
        if: matrix.use_cross == true
        run: cross build --locked --release --target ${{ matrix.target }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: crosslink-${{ matrix.arch }}
          path: crosslink/target/${{ matrix.target }}/release/crosslink
          if-no-files-found: error
          retention-days: 1




  publish-image:
    name: Build & publish image
    needs: build-binary
    runs-on: ubuntu-latest
    outputs:
      primary_tag: ${{ steps.tags.outputs.primary_tag }}
      version: ${{ steps.tags.outputs.version }}
      pushed: ${{ steps.tags.outputs.pushed }}
      tags: ${{ steps.tags.outputs.tags_line }}
      base: ${{ steps.tags.outputs.base }}
      release: ${{ steps.tags.outputs.release }}
      prerelease: ${{ steps.tags.outputs.prerelease }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Download amd64 binary
        uses: actions/download-artifact@v4
        with:
          name: crosslink-amd64
          path: artifacts/amd64

      - name: Download arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: crosslink-arm64
          path: artifacts/arm64

      - name: Stage binaries into build context
        run: |
          cp artifacts/amd64/crosslink crosslink/resources/container/crosslink-amd64
          cp artifacts/arm64/crosslink crosslink/resources/container/crosslink-arm64
          chmod +x crosslink/resources/container/crosslink-amd64
          chmod +x crosslink/resources/container/crosslink-arm64
          ls -lah crosslink/resources/container/

      - name: Compute tags
        id: tags
        run: |
          set -euo pipefail
          REF="${GITHUB_REF}"
          EVENT="${GITHUB_EVENT_NAME}"
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          OWNER="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          BASE="${REGISTRY}/${OWNER}/${IMAGE_NAME}"
          TAGS=()
          PUSH=false
          PRIMARY=""
          VERSION=""
          RELEASE=false
          PRERELEASE=false

          if [ "$EVENT" = "pull_request" ]; then

            TAGS=("${BASE}:pr-${{ github.event.pull_request.number }}")
            PRIMARY="${BASE}:pr-${{ github.event.pull_request.number }}"
            VERSION="pr-${{ github.event.pull_request.number }}"
          elif [ "$EVENT" = "push" ] && [[ "$REF" == refs/tags/v* ]]; then
            VERSION="${REF#refs/tags/v}"
            CARGO_VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' crosslink/Cargo.toml | head -n 1)"
            if [ "$VERSION" != "$CARGO_VERSION" ]; then
              echo "::error::Tag v${VERSION} does not match crosslink/Cargo.toml version ${CARGO_VERSION}; nothing was published"
              exit 1
            fi
            # Only the versioned tag is pushed here. :latest moves later, by
            # digest, after the anonymous smoke test passes, and never for a
            # prerelease (promote-latest).
            TAGS=("${BASE}:${VERSION}")
            PRIMARY="${BASE}:${VERSION}"
            PUSH=true
            RELEASE=true
            case "$VERSION" in *-*) PRERELEASE=true ;; esac
          elif [ "$REF" = "refs/heads/develop" ]; then
            VERSION="nightly-${SHORT_SHA}"
            TAGS=("${BASE}:nightly" "${BASE}:nightly-${SHORT_SHA}")
            PRIMARY="${BASE}:nightly"
            PUSH=true
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$REF" != "refs/heads/develop" ]; then
              echo "::error::Manual image publishes run only from develop (got ${REF}); releases publish from their v* tag push"
              exit 1
            fi
            VERSION="manual-${SHORT_SHA}"
            TAGS=("${BASE}:nightly" "${BASE}:manual-${SHORT_SHA}")
            PRIMARY="${BASE}:nightly"
            PUSH=true
          else
            echo "::error::Unexpected ref/event combination: ref=${REF} event=${EVENT}"
            exit 1
          fi

          {
            echo "tags<<EOF"
            for t in "${TAGS[@]}"; do echo "$t"; done
            echo "EOF"
            echo "push=${PUSH}"
            echo "primary_tag=${PRIMARY}"
            echo "version=${VERSION}"
            echo "pushed=${PUSH}"
            echo "cache_ref=${BASE}:buildcache"
            echo "tags_line=${TAGS[*]}"
            echo "base=${BASE}"
            echo "release=${RELEASE}"
            echo "prerelease=${PRERELEASE}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.tags.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: crosslink/resources/container
          file: crosslink/resources/container/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.tags.outputs.push == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          provenance: false

          cache-from: type=registry,ref=${{ steps.tags.outputs.cache_ref }}
          cache-to: ${{ steps.tags.outputs.push == 'true' && format('type=registry,ref={0},mode=max', steps.tags.outputs.cache_ref) || '' }}



  container-pr-smoke:
    name: Provider smoke (PR)
    needs: build-binary
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: crosslink-amd64
          path: artifacts/amd64
      - name: Stage amd64 binary
        run: |
          cp artifacts/amd64/crosslink crosslink/resources/container/crosslink-amd64
          chmod +x crosslink/resources/container/crosslink-amd64
      - name: Build native smoke image
        run: docker build --build-arg TARGETARCH=amd64 -t crosslink-agent:pr-smoke crosslink/resources/container
      - name: Verify both CLIs and non-root dispatch
        run: |
          set -euo pipefail
          docker run --rm -e CROSSLINK_AGENT_PROVIDER=claude crosslink-agent:pr-smoke bash -c 'test "$(id -u)" != 0 && claude --version'
          docker run --rm -e CROSSLINK_AGENT_PROVIDER=codex crosslink-agent:pr-smoke bash -c 'test "$(id -u)" != 0 && codex --version'
          docker run --rm crosslink-agent:pr-smoke bash -c 'test "$(id -u)" != 0 && gh --version'
      - name: Verify a required GitHub login refuses to start without one
        run: |
          set -euo pipefail
          status=0
          docker run --rm -e CROSSLINK_REQUIRE_GIT_LOGIN=1 crosslink-agent:pr-smoke true || status=$?
          test "$status" = 78
      - name: Verify timeout parity and no key environment
        run: |
          set -euo pipefail
          for provider in claude codex; do
            status="$(docker run --rm -e CROSSLINK_AGENT_PROVIDER="$provider" crosslink-agent:pr-smoke bash -c 'timeout 1s sh -c "sleep 5"; printf "%s\n" "$?"' | tail -n 1)"
            test "$status" = 124
          done
          if docker inspect crosslink-agent:pr-smoke --format '{{json .Config.Env}}' \
            | grep -E 'ANTHROPIC_API_KEY|OPENAI_API_KEY|CODEX_API_KEY|GH_TOKEN|GITHUB_TOKEN|gho_[A-Za-z0-9]|ghp_[A-Za-z0-9]|github_pat_'; then
            echo 'Container image unexpectedly contains an API-key or token environment variable.' >&2
            exit 1
          fi

      - name: Verify isolated account volumes and redacted status
        run: |
          set -euo pipefail
          for provider in claude codex; do
            volume="crosslink-pr-auth-${provider}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            docker volume create "$volume" >/dev/null
            docker run --rm -v "$volume:/home/agent/.${provider}" --entrypoint sh crosslink-agent:pr-smoke -c 'printf refreshed > "$1/session-state"' sh "/home/agent/.${provider}"
            state="$(docker run --rm -v "$volume:/home/agent/.${provider}" --entrypoint sh crosslink-agent:pr-smoke -c 'cat "$1/session-state"' sh "/home/agent/.${provider}")"
            test "$state" = refreshed
            if [ "$provider" = codex ]; then
              status_command='codex login status'
            else
              status_command='claude auth status'
            fi
            status="$(docker run --rm -v "$volume:/home/agent/.${provider}" crosslink-agent:pr-smoke sh -c "$status_command" 2>&1 || true)"
            if printf '%s' "$status" | grep -E 'sk-[A-Za-z0-9]|ANTHROPIC_API_KEY|OPENAI_API_KEY|CODEX_API_KEY|gho_[A-Za-z0-9]|ghp_[A-Za-z0-9]|github_pat_'; then
              echo 'Provider status exposed key-shaped account data.' >&2
              exit 1
            fi
            docker volume rm "$volume" >/dev/null
            if docker volume inspect "$volume" >/dev/null 2>&1; then
              echo "Provider volume was not removed: $volume" >&2
              exit 1
            fi
          done





  smoke-verify:
    name: Smoke verify (${{ matrix.platform }})
    needs: publish-image
    if: needs.publish-image.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Set up QEMU (for non-native arch)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64







      # No login: the smoke test pulls exactly as a user does, so a private
      # package or a tag that did not land fails here instead of in the field.
      - name: Every pushed tag is pullable anonymously
        if: matrix.platform == 'linux/amd64'
        env:
          BASE: ${{ needs.publish-image.outputs.base }}
          TAGS: ${{ needs.publish-image.outputs.tags }}
        run: |
          set -euo pipefail
          repo="${BASE#"${REGISTRY}"/}"
          token="$(curl -fsS "https://${REGISTRY}/token?scope=repository:${repo}:pull" | jq -r '.token // empty')"
          if [ -z "$token" ]; then
            echo "::error::${BASE} refuses anonymous pulls; make the package public in its package settings"
            exit 1
          fi
          for ref in $TAGS; do
            tag="${ref##*:}"
            code="$(curl -sS -o /dev/null -w '%{http_code}' -I \
              -H "Authorization: Bearer ${token}" \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
              "https://${REGISTRY}/v2/${repo}/manifests/${tag}")"
            if [ "$code" != 200 ]; then
              echo "::error::${ref} is not pullable anonymously (HTTP ${code})"
              exit 1
            fi
            echo "anonymous pull OK: ${ref}"
          done

      - name: Pull image
        run: docker pull --platform ${{ matrix.platform }} ${{ needs.publish-image.outputs.primary_tag }}

      - name: Inspect manifest covers both arches (once per matrix is fine)
        if: matrix.platform == 'linux/amd64'
        run: |
          docker manifest inspect ${{ needs.publish-image.outputs.primary_tag }} \
            | jq -e '[.manifests[].platform | "\(.os)/\(.architecture)"] | sort | . == ["linux/amd64","linux/arm64"]'

      - name: Run crosslink --version
        id: version
        run: |
          set -euo pipefail


          OUT=$(docker run --rm --platform ${{ matrix.platform }} \
            --entrypoint /usr/local/bin/crosslink \
            ${{ needs.publish-image.outputs.primary_tag }} --version)
          echo "version output: $OUT"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"

          echo "$OUT" | grep -E '^crosslink [0-9]+\.[0-9]+\.[0-9]+'

      - name: Verify version matches tag (release tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          EXPECTED="${{ needs.publish-image.outputs.version }}"






          ACTUAL=$(echo "${{ steps.version.outputs.out }}" | awk '{print $2}' | sed 's/+.*//')
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Tag version ($EXPECTED) does not match binary version ($ACTUAL)"
            exit 1
          fi
          echo "Version match: $EXPECTED"

  # :latest is the most recent stable release. It moves only after the
  # versioned image has passed the anonymous smoke test on both platforms, by
  # digest, so it always names an image that was verified, and never for a
  # prerelease. Re-pointing it to an older version's digest is the rollback.
  promote-latest:
    name: Promote :latest (stable releases only)
    needs: [publish-image, smoke-verify]
    if: >-
      needs.publish-image.outputs.release == 'true' &&
      needs.publish-image.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point :latest at the verified digest
        env:
          BASE: ${{ needs.publish-image.outputs.base }}
          DIGEST: ${{ needs.publish-image.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          docker buildx imagetools create --tag "${BASE}:latest" "${BASE}@${DIGEST}"
          docker buildx imagetools inspect "${BASE}:latest" --format '{{json .Manifest.Digest}}' | grep -F "$DIGEST"

