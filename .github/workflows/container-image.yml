name: Container Image

# Builds the agent image and, for releases, the whole release:
#
#   gate -> build-binary -> publish-image -> smoke-verify -> promote-latest
#                                                       \-> publish-release
#        \-> release-binaries (release tags) -------------/
#
# A v* tag must match crosslink/Cargo.toml and must not already be published.
# It pushes only :<version>; the anonymous smoke test runs that exact digest;
# :latest then moves to the verified digest, serialized across runs and only
# for the highest stable release; the GitHub release with binaries is created
# only after the image passed. Pushes to develop publish :nightly. crates.io
# publishing (publish.yml) is not part of this flow yet.

on:
  push:
    branches: [develop]
    tags: ['v*']
  pull_request:
    paths:
      - 'crosslink/resources/container/**'
      - '.github/workflows/container-image.yml'
      - '.github/workflows/release-builds.yml'
      - 'crosslink/Cargo.toml'
      - 'crosslink/Cargo.lock'
      - 'crosslink/Cross.toml'
      - 'crosslink/build.rs'
  workflow_dispatch:
    inputs:
      rehearse_promotion:
        description: >-
          After the smoke test, promote this develop build to :promotion-rehearsal
          (exercises the promote-latest path without touching :latest)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event.inputs.rehearse_promotion == 'true' && '-rehearsal' || '' }}
  # Never cancel a release run part-way through publishing.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: crosslink-agent

jobs:
  gate:
    name: Release gate
    runs-on: ubuntu-latest
    outputs:
      push: ${{ steps.plan.outputs.push }}
      tags: ${{ steps.plan.outputs.tags }}
      primary_tag: ${{ steps.plan.outputs.primary_tag }}
      base: ${{ steps.plan.outputs.base }}
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      rehearsal: ${{ steps.plan.outputs.rehearsal }}
      agent_image_tag: ${{ steps.plan.outputs.agent_image_tag }}
      crosslink_version: ${{ steps.plan.outputs.crosslink_version }}
      cache_ref: ${{ steps.plan.outputs.cache_ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Decide what this run may publish
        id: plan
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REHEARSE: ${{ github.event.inputs.rehearse_promotion }}
        run: |
          set -euo pipefail
          OWNER="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          BASE="${REGISTRY}/${OWNER}/${IMAGE_NAME}"
          REPO_PATH="${OWNER}/${IMAGE_NAME}"
          SHORT_SHA="${GITHUB_SHA::7}"
          CARGO_VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("crosslink/Cargo.toml", "rb"))["package"]["version"])')"
          PUSH=false RELEASE=false PRERELEASE=false REHEARSAL=false
          AGENT_IMAGE_TAG=nightly
          case "${GITHUB_EVENT_NAME}:${GITHUB_REF}" in
            pull_request:*)
              VERSION="pr-${PR_NUMBER}"
              TAGS=("${BASE}:pr-${PR_NUMBER}")
              ;;
            push:refs/tags/v*)
              VERSION="${GITHUB_REF#refs/tags/v}"
              if [ "$VERSION" != "$CARGO_VERSION" ]; then
                echo "::error::Tag v${VERSION} does not match crosslink/Cargo.toml version ${CARGO_VERSION}; nothing was published"
                exit 1
              fi
              # Releases come from main: a tag on any other commit publishes nothing.
              if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
                echo "::error::v${VERSION} points at ${GITHUB_SHA}, which is not on main; releases are tagged on main"
                exit 1
              fi
              # A published version is never replaced: pinned tags are pulled
              # once and cached, so a second image under the same tag would
              # split users across two builds. Only an explicit "not found"
              # lets the release proceed; anything else fails closed.
              token="$(curl -sS "https://${REGISTRY}/token?scope=repository:${REPO_PATH}:pull" | jq -r '.token // empty' || true)"
              if [ -z "$token" ]; then
                echo "::error::cannot confirm ${BASE}:${VERSION} is unpublished: no anonymous registry token (package private, missing, or registry unavailable)"
                exit 1
              fi
              code="$(curl -sS -o /dev/null -w '%{http_code}' -I \
                -H "Authorization: Bearer ${token}" \
                -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
                "https://${REGISTRY}/v2/${REPO_PATH}/manifests/${VERSION}" || true)"
              case "$code" in
                404) ;;
                200)
                  echo "::error::${BASE}:${VERSION} is already published; versions are never republished. Release a new version instead."
                  exit 1
                  ;;
                *)
                  echo "::error::cannot confirm ${BASE}:${VERSION} is unpublished (registry answered HTTP ${code:-none}); retry when the registry is healthy"
                  exit 1
                  ;;
              esac
              TAGS=("${BASE}:${VERSION}")
              PUSH=true RELEASE=true AGENT_IMAGE_TAG="${VERSION}"
              case "$VERSION" in *-*) PRERELEASE=true ;; esac
              ;;
            push:refs/heads/develop|workflow_dispatch:refs/heads/develop)
              VERSION="nightly-${SHORT_SHA}"
              TAGS=("${BASE}:nightly" "${BASE}:nightly-${SHORT_SHA}")
              PUSH=true
              if [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ] && [ "${REHEARSE:-false}" = true ]; then
                REHEARSAL=true
              fi
              ;;
            workflow_dispatch:*)
              echo "::error::Manual image publishes run only from develop (got ${GITHUB_REF}); releases publish from their v* tag push"
              exit 1
              ;;
            *)
              echo "::error::Unexpected event/ref: ${GITHUB_EVENT_NAME} ${GITHUB_REF}"
              exit 1
              ;;
          esac
          {
            echo "push=${PUSH}"
            echo "tags<<EOF"
            printf '%s\n' "${TAGS[@]}"
            echo "EOF"
            echo "primary_tag=${TAGS[0]}"
            echo "base=${BASE}"
            echo "version=${VERSION}"
            echo "release=${RELEASE}"
            echo "prerelease=${PRERELEASE}"
            echo "rehearsal=${REHEARSAL}"
            echo "agent_image_tag=${AGENT_IMAGE_TAG}"
            echo "crosslink_version=${CARGO_VERSION}+${SHORT_SHA}"
            echo "cache_ref=${BASE}:buildcache"
          } >> "$GITHUB_OUTPUT"
          echo "Plan: push=${PUSH} release=${RELEASE} prerelease=${PRERELEASE} rehearsal=${REHEARSAL} tags=${TAGS[*]}"

  build-binary:
    name: Build binary (${{ matrix.arch }})
    needs: gate
    runs-on: ubuntu-latest
    env:
      # The default agent image the binaries in this image will use: the
      # release version on a tag, nightly otherwise. Set explicitly, never inferred.
      CROSSLINK_AGENT_IMAGE_TAG: ${{ needs.gate.outputs.agent_image_tag }}
      CROSSLINK_AGENT_IMAGE_REPOSITORY: ${{ needs.gate.outputs.base }}
      # One version string for every architecture (cross cannot see .git).
      CROSSLINK_VERSION: ${{ needs.gate.outputs.crosslink_version }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
            use_cross: false
          - arch: arm64
            target: aarch64-unknown-linux-musl
            use_cross: true
    defaults:
      run:
        working-directory: crosslink
    steps:
      - uses: actions/checkout@v4

      - name: Install musl-tools (amd64 native build)
        if: matrix.use_cross == false
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (arm64 only)
        if: matrix.use_cross == true
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            crosslink/target/
          key: ${{ runner.os }}-cargo-container-${{ matrix.target }}-${{ hashFiles('crosslink/Cargo.lock') }}

      - name: Build release binary (native)
        if: matrix.use_cross == false
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Build release binary (cross)
        if: matrix.use_cross == true
        run: cross build --locked --release --target ${{ matrix.target }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: crosslink-${{ matrix.arch }}
          path: crosslink/target/${{ matrix.target }}/release/crosslink
          if-no-files-found: error
          retention-days: 1

  publish-image:
    name: Build & publish image
    needs: [gate, build-binary]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      crosslink_version: ${{ steps.label.outputs.crosslink_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download amd64 binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: crosslink-amd64
          path: artifacts/amd64

      - name: Download arm64 binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: crosslink-arm64
          path: artifacts/arm64

      - name: Stage binaries into build context
        run: |
          cp artifacts/amd64/crosslink crosslink/resources/container/crosslink-amd64
          cp artifacts/arm64/crosslink crosslink/resources/container/crosslink-arm64
          chmod +x crosslink/resources/container/crosslink-amd64
          chmod +x crosslink/resources/container/crosslink-arm64

      - name: Check the binary reports the gate's version
        id: label
        env:
          EXPECTED: ${{ needs.gate.outputs.crosslink_version }}
        run: |
          set -euo pipefail
          out="$(crosslink/resources/container/crosslink-amd64 --version)"
          if [ "$out" != "crosslink ${EXPECTED}" ]; then
            echo "::error::amd64 binary reports '${out}', expected 'crosslink ${EXPECTED}'"
            exit 1
          fi
          echo "crosslink_version=${EXPECTED}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        if: needs.gate.outputs.push == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: crosslink/resources/container
          file: crosslink/resources/container/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.gate.outputs.push == 'true' }}
          tags: ${{ needs.gate.outputs.tags }}
          labels: |
            dev.crosslink.version=${{ steps.label.outputs.crosslink_version }}
            org.opencontainers.image.version=${{ steps.label.outputs.crosslink_version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: false
          # Releases build without the registry cache that develop pushes
          # write, so a release image follows only from its tagged source.
          no-cache: ${{ needs.gate.outputs.release == 'true' }}
          cache-from: ${{ needs.gate.outputs.release != 'true' && format('type=registry,ref={0}', needs.gate.outputs.cache_ref) || '' }}
          cache-to: ${{ needs.gate.outputs.push == 'true' && needs.gate.outputs.release != 'true' && format('type=registry,ref={0},mode=max', needs.gate.outputs.cache_ref) || '' }}

      - name: Attest the image build
        if: needs.gate.outputs.push == 'true'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ needs.gate.outputs.base }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  container-pr-smoke:
    name: Provider smoke (PR)
    needs: [gate, build-binary]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: crosslink-amd64
          path: artifacts/amd64
      - name: Stage amd64 binary
        run: |
          cp artifacts/amd64/crosslink crosslink/resources/container/crosslink-amd64
          chmod +x crosslink/resources/container/crosslink-amd64
      - name: Build native smoke image
        run: docker build --build-arg TARGETARCH=amd64 -t crosslink-agent:pr-smoke crosslink/resources/container
      - name: Verify both CLIs and non-root dispatch
        run: |
          set -euo pipefail
          docker run --rm -e CROSSLINK_AGENT_PROVIDER=claude crosslink-agent:pr-smoke bash -c 'test "$(id -u)" != 0 && claude --version'
          docker run --rm -e CROSSLINK_AGENT_PROVIDER=codex crosslink-agent:pr-smoke bash -c 'test "$(id -u)" != 0 && codex --version'
          docker run --rm crosslink-agent:pr-smoke bash -c 'test "$(id -u)" != 0 && gh --version'
      - name: Verify a required GitHub login refuses to start without one
        run: |
          set -euo pipefail
          status=0
          docker run --rm -e CROSSLINK_REQUIRE_GIT_LOGIN=1 crosslink-agent:pr-smoke true || status=$?
          test "$status" = 78
      - name: Verify timeout parity and no key environment
        run: |
          set -euo pipefail
          for provider in claude codex; do
            status="$(docker run --rm -e CROSSLINK_AGENT_PROVIDER="$provider" crosslink-agent:pr-smoke bash -c 'timeout 1s sh -c "sleep 5"; printf "%s\n" "$?"' | tail -n 1)"
            test "$status" = 124
          done
          if docker inspect crosslink-agent:pr-smoke --format '{{json .Config.Env}}' \
            | grep -E 'ANTHROPIC_API_KEY|OPENAI_API_KEY|CODEX_API_KEY|GH_TOKEN|GITHUB_TOKEN|gho_[A-Za-z0-9]|ghp_[A-Za-z0-9]|github_pat_'; then
            echo 'Container image unexpectedly contains an API-key or token environment variable.' >&2
            exit 1
          fi

      - name: Verify isolated account volumes and redacted status
        run: |
          set -euo pipefail
          for provider in claude codex; do
            volume="crosslink-pr-auth-${provider}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            docker volume create "$volume" >/dev/null
            docker run --rm -v "$volume:/home/agent/.${provider}" --entrypoint sh crosslink-agent:pr-smoke -c 'printf refreshed > "$1/session-state"' sh "/home/agent/.${provider}"
            state="$(docker run --rm -v "$volume:/home/agent/.${provider}" --entrypoint sh crosslink-agent:pr-smoke -c 'cat "$1/session-state"' sh "/home/agent/.${provider}")"
            test "$state" = refreshed
            if [ "$provider" = codex ]; then
              status_command='codex login status'
            else
              status_command='claude auth status'
            fi
            status="$(docker run --rm -v "$volume:/home/agent/.${provider}" crosslink-agent:pr-smoke sh -c "$status_command" 2>&1 || true)"
            if printf '%s' "$status" | grep -E 'sk-[A-Za-z0-9]|ANTHROPIC_API_KEY|OPENAI_API_KEY|CODEX_API_KEY|gho_[A-Za-z0-9]|ghp_[A-Za-z0-9]|github_pat_'; then
              echo 'Provider status exposed key-shaped account data.' >&2
              exit 1
            fi
            docker volume rm "$volume" >/dev/null
            if docker volume inspect "$volume" >/dev/null 2>&1; then
              echo "Provider volume was not removed: $volume" >&2
              exit 1
            fi
          done

  smoke-verify:
    name: Smoke verify (${{ matrix.platform }})
    needs: [gate, publish-image]
    if: needs.gate.outputs.push == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    env:
      BASE: ${{ needs.gate.outputs.base }}
      DIGEST: ${{ needs.publish-image.outputs.digest }}
    steps:
      - name: Set up QEMU (for non-native arch)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      # No login: the smoke test pulls exactly as a user does, so a private
      # package or a tag that did not land fails here instead of in the field.
      - name: Every pushed tag resolves anonymously to the built digest
        if: matrix.platform == 'linux/amd64'
        env:
          TAGS: ${{ needs.gate.outputs.tags }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          repo="${BASE#"${REGISTRY}"/}"
          token="$(curl -sS "https://${REGISTRY}/token?scope=repository:${repo}:pull" | jq -r '.token // empty' || true)"
          if [ -z "$token" ]; then
            echo "::error::${BASE} refuses anonymous pulls; make the package public in its package settings"
            exit 1
          fi
          for ref in $TAGS; do
            tag="${ref##*:}"
            headers="$(curl -sS -o /dev/null -D - -I \
              -H "Authorization: Bearer ${token}" \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
              "https://${REGISTRY}/v2/${repo}/manifests/${tag}")"
            status="$(printf '%s' "$headers" | head -n 1 | awk '{print $2}')"
            got="$(printf '%s' "$headers" | tr -d '\r' | awk -F': ' 'tolower($1) == "docker-content-digest" {print $2}')"
            if [ "$status" != 200 ]; then
              echo "::error::${ref} is not pullable anonymously (HTTP ${status})"
              exit 1
            fi
            if [ "$got" != "$DIGEST" ]; then
              echo "::error::${ref} resolves to ${got}, not the built digest ${DIGEST}"
              exit 1
            fi
            echo "anonymous pull OK: ${ref} -> ${got}"
          done

      - name: Pull the built digest
        run: docker pull --platform ${{ matrix.platform }} "${BASE}@${DIGEST}"

      - name: The image's tools run on this platform
        run: |
          docker run --rm --platform ${{ matrix.platform }} "${BASE}@${DIGEST}" \
            bash -c 'set -e; claude --version; codex --version; gh --version | head -n 1; uv --version'

      - name: Manifest covers both architectures (once)
        if: matrix.platform == 'linux/amd64'
        run: |
          docker manifest inspect "${BASE}@${DIGEST}" \
            | jq -e '[.manifests[].platform | select(.os != "unknown") | "\(.os)/\(.architecture)"] | sort | . == ["linux/amd64","linux/arm64"]'

      - name: Run crosslink --version and check the image's version label
        env:
          LABEL_VERSION: ${{ needs.publish-image.outputs.crosslink_version }}
          AGENT_IMAGE_TAG: ${{ needs.gate.outputs.agent_image_tag }}
          RELEASE: ${{ needs.gate.outputs.release }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          out="$(docker run --rm --platform ${{ matrix.platform }} --entrypoint /usr/local/bin/crosslink "${BASE}@${DIGEST}" --version)"
          echo "version output: $out"
          echo "$out" | grep -E '^crosslink [0-9]+\.[0-9]+\.[0-9]+'
          label="$(docker image inspect --format '{{ index .Config.Labels "dev.crosslink.version" }}' "${BASE}@${DIGEST}")"
          if [ "crosslink ${label}" != "$out" ] || [ "$label" != "$LABEL_VERSION" ]; then
            echo "::error::image label '${label}' does not match its binary '${out}'"
            exit 1
          fi
          # The binary must default to this image: the build-matched contract.
          expected_default="${BASE}:${AGENT_IMAGE_TAG}"
          if ! docker run --rm --platform ${{ matrix.platform }} --entrypoint grep "${BASE}@${DIGEST}" -aqF "$expected_default" /usr/local/bin/crosslink; then
            echo "::error::the ${{ matrix.platform }} binary does not default to ${expected_default}"
            exit 1
          fi
          if [ "$RELEASE" = true ]; then
            actual="$(echo "$out" | awk '{print $2}' | sed 's/+.*//')"
            if [ "$VERSION" != "$actual" ]; then
              echo "::error::Tag version ($VERSION) does not match binary version ($actual)"
              exit 1
            fi
          fi

  # :latest is the most recent stable release. It moves only to the digest the
  # smoke test ran, only when that version is the highest stable v* tag (a
  # backport or a re-run of an older release never moves it backwards), and one
  # promotion at a time across runs. Re-pointing it to an older version's
  # digest by hand is the rollback. A develop dispatch with
  # rehearse_promotion exercises this job against :promotion-rehearsal.
  promote-latest:
    name: Promote verified image (:latest or rehearsal)
    needs: [gate, publish-image, smoke-verify]
    if: >-
      (needs.gate.outputs.release == 'true' && needs.gate.outputs.prerelease == 'false') ||
      needs.gate.outputs.rehearsal == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: promote-latest-${{ github.repository }}
      cancel-in-progress: false
    env:
      BASE: ${{ needs.gate.outputs.base }}
      DIGEST: ${{ needs.publish-image.outputs.digest }}
      VERSION: ${{ needs.gate.outputs.version }}
      REHEARSAL: ${{ needs.gate.outputs.rehearsal }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Decide the target tag
        id: target
        run: |
          set -euo pipefail
          if [ "$REHEARSAL" = true ]; then
            echo "tag=promotion-rehearsal" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          highest="$(git -c versionsort.suffix=- tag --list 'v*' --sort=-version:refname | grep -v -- '-' | head -n 1)"
          if [ "$highest" != "v${VERSION}" ]; then
            echo "::notice::v${VERSION} is not the highest stable release (${highest}); :latest stays where it is"
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=latest" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        if: steps.target.outputs.tag != ''
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        if: steps.target.outputs.tag != ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point the tag at the verified digest
        if: steps.target.outputs.tag != ''
        env:
          TARGET: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          # The source must exist before anything moves.
          docker buildx imagetools inspect "${BASE}@${DIGEST}" > /dev/null
          docker buildx imagetools create --tag "${BASE}:${TARGET}" "${BASE}@${DIGEST}"
          repo="${BASE#"${REGISTRY}"/}"
          token="$(curl -sS "https://${REGISTRY}/token?scope=repository:${repo}:pull" | jq -r '.token // empty' || true)"
          got="$(curl -sS -o /dev/null -D - -I -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
            "https://${REGISTRY}/v2/${repo}/manifests/${TARGET}" | tr -d '\r' | awk -F': ' 'tolower($1) == "docker-content-digest" {print $2}')"
          if [ "$got" != "$DIGEST" ]; then
            echo "::error::${BASE}:${TARGET} resolves to '${got}', not ${DIGEST}; re-point it by hand"
            exit 1
          fi
          echo "${BASE}:${TARGET} -> ${DIGEST}"

  release-binaries:
    name: Release binaries
    needs: gate
    if: needs.gate.outputs.release == 'true'
    uses: ./.github/workflows/release-builds.yml
    with:
      agent_image_tag: ${{ needs.gate.outputs.version }}
      agent_image_repository: ${{ needs.gate.outputs.base }}
      crosslink_version: ${{ needs.gate.outputs.crosslink_version }}

  # The GitHub release is created only after the image for this version passed
  # its anonymous smoke test, because every attached binary defaults to it.
  publish-release:
    name: Publish GitHub release
    needs: [gate, smoke-verify, release-binaries]
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      PRERELEASE: ${{ needs.gate.outputs.prerelease }}
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          pattern: release-*

      - name: Collect assets and checksums
        run: |
          set -euo pipefail
          mkdir -p release
          for dir in dist/release-*/; do
            name="$(basename "$dir")"
            name="${name#release-}"
            for file in "$dir"*; do
              case "$file" in
                *.tar.gz) cp "$file" release/ ;;
                *) cp "$file" "release/${name}" ;;
              esac
            done
          done
          (cd release && sha256sum -- * > SHA256SUMS)
          cat release/SHA256SUMS

      - name: Attest the release binaries
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: release/*

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "v${VERSION}" release/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "v${VERSION}" \
            --generate-notes \
            "${flags[@]}"
