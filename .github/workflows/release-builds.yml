name: Release Builds




on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  package-codex-plugin:
    name: Package Codex Plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify generated plugin
        working-directory: crosslink
        run: python3 scripts/sync-codex-plugin.py --check
      - name: Install Codex CLI
        run: npm install --global @openai/codex@0.147.0
      - name: Install and inspect plugin through its marketplace
        working-directory: crosslink
        env:
          CODEX_HOME: ${{ runner.temp }}/crosslink-codex-home
        run: |
          mkdir -p "$CODEX_HOME"
          codex plugin marketplace add "$PWD/resources"
          codex plugin add crosslink-codex@personal
          codex plugin list | grep -F 'crosslink-codex@personal'
          codex mcp list | grep -F 'crosslink-knowledge'
          codex mcp list | grep -F 'crosslink-agent-prompt'

          VERSION=$(python3 -c 'import json; print(json.load(open("resources/plugins/crosslink-codex/.codex-plugin/plugin.json"))["version"])')
          PLUGIN_CACHE="$CODEX_HOME/plugins/cache/personal/crosslink-codex/$VERSION"
          test -f "$PLUGIN_CACHE/hooks/hooks.json"
          test -f "$PLUGIN_CACHE/skills/crosslink-guide/SKILL.md"
          test -f "$PLUGIN_CACHE/.mcp.json"

          touch "$PLUGIN_CACHE/orphaned-upgrade-sentinel"
          codex plugin remove crosslink-codex@personal
          codex plugin add crosslink-codex@personal
          test ! -e "$PLUGIN_CACHE/orphaned-upgrade-sentinel"
          test -f "$PLUGIN_CACHE/hooks/hooks.json"
      - name: Create versioned archive
        working-directory: crosslink
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("resources/plugins/crosslink-codex/.codex-plugin/plugin.json"))["version"])')
          tar -czf "crosslink-codex-plugin-${VERSION}.tar.gz" -C resources/plugins crosslink-codex
          mkdir -p package/.agents/plugins package/plugins
          cp resources/.agents/plugins/marketplace.json package/.agents/plugins/marketplace.json
          cp -R resources/plugins/crosslink-codex package/plugins/crosslink-codex
          tar -czf "crosslink-codex-marketplace-${VERSION}.tar.gz" -C package .
      - name: Upload plugin release artifact
        uses: actions/upload-artifact@v4
        with:
          name: crosslink-codex-plugin
          path: |
            crosslink/crosslink-codex-plugin-*.tar.gz
            crosslink/crosslink-codex-marketplace-*.tar.gz
          if-no-files-found: error

  build-release:
    name: Build Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: crosslink
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: crosslink-linux
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: crosslink-macos
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: crosslink-win.exe
    steps:
      - uses: actions/checkout@v4

      - name: Install musl-tools (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: crosslink/target/${{ matrix.target }}/release/crosslink${{ matrix.os == 'windows-latest' && '.exe' || '' }}
