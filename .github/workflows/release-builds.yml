name: Release Builds




# Builds the release binaries and Codex plugin archives. Pull requests to main
# build them as a check; releases run this as a reusable workflow from
# container-image.yml, which attaches the results to the GitHub release only
# after the release's agent image has passed its smoke test.
on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      agent_image_tag:
        description: The default agent image tag the binaries bake in (the release version)
        type: string
        required: true
      agent_image_repository:
        description: The agent image repository the binaries default to
        type: string
        required: true
      crosslink_version:
        description: The version string every binary reports
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-builds-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Release runs pass the version; pull-request check builds are development builds.
  CROSSLINK_AGENT_IMAGE_TAG: ${{ inputs.agent_image_tag || 'nightly' }}
  CROSSLINK_AGENT_IMAGE_REPOSITORY: ${{ inputs.agent_image_repository }}
  CROSSLINK_VERSION: ${{ inputs.crosslink_version }}

jobs:
  package-codex-plugin:
    name: Package Codex Plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify generated plugin
        working-directory: crosslink
        run: python3 scripts/sync-codex-plugin.py --check
      - name: Install Codex CLI
        run: npm install --global @openai/codex@0.147.0
      - name: Install and inspect plugin through its marketplace
        working-directory: crosslink
        env:
          CODEX_HOME: ${{ runner.temp }}/crosslink-codex-home
        run: |
          mkdir -p "$CODEX_HOME"
          codex plugin marketplace add "$PWD/resources"
          codex plugin add crosslink-codex@personal
          codex plugin list | grep -F 'crosslink-codex@personal'
          codex mcp list | grep -F 'crosslink-knowledge'
          codex mcp list | grep -F 'crosslink-agent-prompt'

          VERSION=$(python3 -c 'import json; print(json.load(open("resources/plugins/crosslink-codex/.codex-plugin/plugin.json"))["version"])')
          PLUGIN_CACHE="$CODEX_HOME/plugins/cache/personal/crosslink-codex/$VERSION"
          test -f "$PLUGIN_CACHE/hooks/hooks.json"
          test -f "$PLUGIN_CACHE/skills/crosslink-guide/SKILL.md"
          test -f "$PLUGIN_CACHE/.mcp.json"

          touch "$PLUGIN_CACHE/orphaned-upgrade-sentinel"
          codex plugin remove crosslink-codex@personal
          codex plugin add crosslink-codex@personal
          test ! -e "$PLUGIN_CACHE/orphaned-upgrade-sentinel"
          test -f "$PLUGIN_CACHE/hooks/hooks.json"
      - name: Create versioned archive
        working-directory: crosslink
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("resources/plugins/crosslink-codex/.codex-plugin/plugin.json"))["version"])')
          tar -czf "crosslink-codex-plugin-${VERSION}.tar.gz" -C resources/plugins crosslink-codex
          mkdir -p package/.agents/plugins package/plugins
          cp resources/.agents/plugins/marketplace.json package/.agents/plugins/marketplace.json
          cp -R resources/plugins/crosslink-codex package/plugins/crosslink-codex
          tar -czf "crosslink-codex-marketplace-${VERSION}.tar.gz" -C package .
      - name: Upload plugin release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-crosslink-codex-plugin
          path: |
            crosslink/crosslink-codex-plugin-*.tar.gz
            crosslink/crosslink-codex-marketplace-*.tar.gz
          if-no-files-found: error

  build-release:
    name: Build Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: crosslink
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: release-crosslink-linux-x86_64
            use_cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact: release-crosslink-linux-aarch64
            use_cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: release-crosslink-macos-aarch64
            use_cross: false
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: release-crosslink-macos-x86_64
            use_cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: release-crosslink-windows-x86_64.exe
            use_cross: false
    steps:
      - uses: actions/checkout@v4

      - name: Install musl-tools (Linux native only)
        if: matrix.os == 'ubuntu-latest' && matrix.use_cross == false
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux aarch64 only)
        if: matrix.use_cross == true
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build release (native)
        if: matrix.use_cross == false
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Build release (cross)
        if: matrix.use_cross == true
        run: cross build --locked --release --target ${{ matrix.target }}

      - name: Check the binary defaults to the release image (release runs)
        if: inputs.agent_image_tag != ''
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/crosslink${{ matrix.os == 'windows-latest' && '.exe' || '' }}"
          expected="${{ inputs.agent_image_repository }}:${{ inputs.agent_image_tag }}"
          grep -aqF "$expected" "$bin" || { echo "::error::${bin} does not default to ${expected}"; exit 1; }
          grep -aqF "${{ inputs.crosslink_version }}" "$bin" || { echo "::error::${bin} does not carry version ${{ inputs.crosslink_version }}"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: crosslink/target/${{ matrix.target }}/release/crosslink${{ matrix.os == 'windows-latest' && '.exe' || '' }}
