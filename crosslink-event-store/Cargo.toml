[package]
name = "crosslink-event-store"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
publish = false
license = "MIT"
description = "Narrow append-only Git-ref event storage extracted for Crosslink consumers"
repository = "https://github.com/dollspace-gay/crosslink"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
