[build.env]
# The agent image defaults and version string CI bakes in (see build.rs).
passthrough = [
    "CROSSLINK_AGENT_IMAGE_TAG",
    "CROSSLINK_AGENT_IMAGE_REPOSITORY",
    "CROSSLINK_VERSION",
]



























[target.aarch64-unknown-linux-musl]
pre-build = [
    "mkdir -p /dashboard/dist",
    "chmod 0777 /dashboard /dashboard/dist",
]
