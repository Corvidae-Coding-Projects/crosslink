# Crosslink-owned MCP registrations. `crosslink init` merges only these tables.
[mcp_servers.crosslink-knowledge]
command = "uv"
args = ["run", ".crosslink/integrations/mcp/knowledge-server.py"]
required = true

[mcp_servers.crosslink-agent-prompt]
command = "uv"
args = ["run", ".crosslink/integrations/mcp/agent-prompt-server.py"]
required = true
