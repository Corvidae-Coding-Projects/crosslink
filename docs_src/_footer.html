<footer class="crosslink-footer" id="crosslink-footer">
  <hr class="crosslink-rule" />
  <div class="crosslink-wordmark-row">
    <a href="https://github.com/Corvidae-Coding-Projects/crosslink" class="crosslink-wordmark-link">
      <img alt="Crosslink" class="crosslink-wordmark" id="crosslinkWordmark" />
    </a>
    <div class="crosslink-confetti" id="crosslinkConfetti"></div>
  </div>
  <p class="crosslink-copyright">&copy; 2026 Crosslink contributors &middot; Built with <a href="https://quarto.org">Quarto</a></p>
</footer>

<script>
(function() {

  var footer = document.getElementById('crosslink-footer');
  var pageNav = document.querySelector('nav.page-navigation');
  if (footer && pageNav && pageNav.parentNode) {

    pageNav.parentNode.insertBefore(footer, pageNav.nextSibling);
  } else {

    var contentArea = document.querySelector('#quarto-content main.content');
    if (!contentArea) {
      contentArea = document.querySelector('#quarto-content > .page-columns');
    }
    if (footer && contentArea) {
      contentArea.appendChild(footer);
    }
  }


  var img = document.getElementById('crosslinkWordmark');
  if (img) {
    var candidates = [
      'assets/img/crosslink-wordmark.svg',
      '../assets/img/crosslink-wordmark.svg',
      '../../assets/img/crosslink-wordmark.svg',
    ];
    var tryIndex = 0;
    function tryNext() {
      if (tryIndex < candidates.length) {
        img.src = candidates[tryIndex++];
      }
    }
    img.onerror = tryNext;
    tryNext();
  }




  var COLOR_TABLE = [
    { color: '#ede2e4', weight: 10 },
    { color: '#FFB6C6', weight: 5 },
    { color: '#F95838', weight: 5 },
    { color: '#00A6DB', weight: 8 },
    { color: '#FFCE02', weight: 7 },
  ];
  var TOTAL_WEIGHT = 0;
  for (var ci = 0; ci < COLOR_TABLE.length; ci++) TOTAL_WEIGHT += COLOR_TABLE[ci].weight;

  function pickColor() {
    var r = Math.random() * TOTAL_WEIGHT;
    for (var ci = 0; ci < COLOR_TABLE.length; ci++) {
      r -= COLOR_TABLE[ci].weight;
      if (r <= 0) return COLOR_TABLE[ci].color;
    }
    return COLOR_TABLE[0].color;
  }

  var DOT_COUNT = 14;
  var DOT_SIZE = 11;

  var holder = document.getElementById('crosslinkConfetti');
  if (!holder) return;


  var FIELD_W = 180;
  var ORIGIN_Y = 45;
  var SLOPE = -0.28;
  var CONE_HALF_ANGLE = 0.22;
  var NOISE = 10;

  function sampleDot() {
    for (var attempts = 0; attempts < 50; attempts++) {
      var x = Math.random() * FIELD_W;
      var meanY = ORIGIN_Y + SLOPE * x;
      var spread = Math.max(5, x * CONE_HALF_ANGLE);
      var y = meanY + (Math.random() - 0.5) * 2 * spread;

      x += (Math.random() - 0.5) * NOISE;
      y += (Math.random() - 0.5) * NOISE;
      if (x >= 0) return { x: Math.floor(x), y: Math.floor(y) };
    }
    return { x: 0, y: ORIGIN_Y };
  }

  var dots = [];
  for (var i = 0; i < DOT_COUNT; i++) {
    var dot = document.createElement('div');
    dot.className = 'crosslink-dot';
    dot.style.width = DOT_SIZE + 'px';
    dot.style.height = DOT_SIZE + 'px';
    dot.style.backgroundColor = pickColor();

    var pos = sampleDot();
    dot.style.left = pos.x + 'px';
    dot.style.top = pos.y + 'px';
    dot.style.opacity = '0';
    holder.appendChild(dot);
    dots.push(dot);
  }


  dots.sort(function(a, b) {
    return parseFloat(a.style.left) - parseFloat(b.style.left);
  });

  var revealed = false;
  function revealDots() {
    if (revealed) return;
    revealed = true;
    dots.forEach(function(dot, i) {
      setTimeout(function() {
        dot.style.transition = 'opacity 0.4s ease-in';
        dot.style.opacity = '1';
      }, i * 50);
    });
  }

  if ('IntersectionObserver' in window) {
    var observer = new IntersectionObserver(function(entries) {
      if (entries[0].isIntersecting) {
        revealDots();
        observer.disconnect();
      }
    }, { threshold: 0.1 });
    observer.observe(holder);
  } else {
    revealDots();
  }
})();
</script>
